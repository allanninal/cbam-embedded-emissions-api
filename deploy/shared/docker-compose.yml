# SHARED services for this server — deployed ONCE, used by many projects
# (this CBAM API and the sibling C2PA and EUDR APIs).
#
# Intentionally separate from any single project's compose so tearing down a
# project (docker compose down) never removes shared Redis or the gateway.
#
# First-time setup on the server:
#   1. Create the shared network (once):
#        docker network create shared-net
#   2. Put REDIS_PASSWORD in deploy/shared/.env (see .env.example) — the SAME
#      value each project's .env uses.
#   3. Start:
#        docker compose -f deploy/shared/docker-compose.yml up -d
#
# How projects use it:
#   - join the external network `shared-net`
#   - connect to host `shared-redis:6379`
#   - use a PROJECT-SPECIFIC key prefix (cbam:rl:, c2pa:rl:, eudr:rl:) and/or DB
#     index so keys never collide.
# Gateway routes for every project live in apisix/apisix.yaml.

services:
  redis:
    image: redis:7.4-alpine
    container_name: shared-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    environment:
      REDISCLI_AUTH: "${REDIS_PASSWORD}"
    networks:
      - shared-net
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - SETPCAP
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 320M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  apisix:
    image: apache/apisix:3.9.1-debian
    container_name: shared-apisix
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
    entrypoint: ["/bin/sh", "/opt/entrypoint.sh"]
    volumes:
      - ./apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./apisix/apisix.yaml:/opt/apisix.yaml.tmpl:ro
      - ./apisix/entrypoint.sh:/opt/entrypoint.sh:ro
    networks:
      - shared-net
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/9080"]
      interval: 20s
      timeout: 5s
      retries: 5

networks:
  shared-net:
    external: true
