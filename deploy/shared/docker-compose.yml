# SHARED services for this server — deployed ONCE, used by many projects
# (the Tenders, DPP, CBAM, C2PA and EUDR APIs).
#
# Owns the single public edge + gateway for the whole server:
#   - caddy   : the ONLY container binding :80/:443 (TLS, body cap, real IP,
#               landing page). Mounts ../Caddyfile (deploy/Caddyfile).
#   - apisix  : path-prefix routing, Redis rate limiting, CORS.
#   - redis   : shared rate-limit counters.
#
# Intentionally separate from any single project's compose so tearing down a
# project (docker compose down) never removes the shared edge, gateway, or Redis.
# Per-project composes define ONLY their own `api` container and join `shared-net`.
#
# First-time setup on the server:
#   1. Create the shared network (once):
#        docker network create shared-net
#   2. Put REDIS_PASSWORD (and optionally SITE_ADDRESS) in deploy/shared/.env
#      (see .env.example) — the SAME REDIS_PASSWORD value each project's .env uses.
#   3. Start the shared edge + gateway + redis:
#        docker compose -f deploy/shared/docker-compose.yml up -d
#   4. Start each project's api (from that project's repo root):
#        docker compose up -d api
#
# How projects use it:
#   - join the external network `shared-net`
#   - connect to host `shared-redis:6379`
#   - use a PROJECT-SPECIFIC key prefix (tenders:rl:, dpp:rl:, cbam:rl:, c2pa:rl:, eudr:rl:)
#     and/or DB index so keys never collide.
# Gateway routes for every project live in apisix/apisix.yaml; the landing page
# + per-prefix forwarding live in ../Caddyfile. Both are kept identical across
# the sibling repos.

services:
  redis:
    image: redis:7.4-alpine
    container_name: shared-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    environment:
      REDISCLI_AUTH: "${REDIS_PASSWORD}"
    networks:
      - shared-net
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - SETPCAP
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 320M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  apisix:
    image: apache/apisix:3.18.0-debian
    container_name: shared-apisix
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
    entrypoint: ["/bin/sh", "/opt/entrypoint.sh"]
    volumes:
      - ./apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./apisix/apisix.yaml:/opt/apisix.yaml.tmpl:ro
      - ./apisix/entrypoint.sh:/opt/entrypoint.sh:ro
    networks:
      - shared-net
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/9080"]
      interval: 20s
      timeout: 5s
      retries: 5

  # The SINGLE public edge for the whole server. This is the ONLY place `caddy`
  # is defined — per-project composes no longer declare it, so there is no
  # container-name collision and no "last repo deployed wins" config drift.
  caddy:
    image: caddy:2.11.1
    container_name: shared-caddy
    restart: unless-stopped
    environment:
      # Set to a domain (e.g. apis.example.com) in deploy/shared/.env to enable
      # automatic HTTPS. Defaults to :80 (bare-IP HTTP) when unset.
      SITE_ADDRESS: "${SITE_ADDRESS:-:80}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - shared-net
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    depends_on:
      - apisix

networks:
  shared-net:
    external: true

volumes:
  caddy-data:
  caddy-config:
