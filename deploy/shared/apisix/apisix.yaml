      cors:
        allow_origins: "*"
        allow_methods: "GET,POST,PATCH,OPTIONS"
        allow_headers: "authorization,content-type"

  # ---- DPP: compute API + JSON resolver (rate limited via shared Redis) ----
  - id: dpp-compute
    uri: /dpp/v1/*
    upstream:
      type: roundrobin
      nodes:
        "dpp-api:8794": 1
