        trusted_addresses:
          - 172.16.0.0/12
          - 10.0.0.0/8
          - 192.168.0.0/16
      proxy-rewrite:
        regex_uri: ["^/dpp/(.*)", "/$1"]
      # Per-client gateway rate limit keyed on the REAL client IP (resolved by
      # real-ip from the trusted proxy). We deliberately do NOT key on
      # $http_authorization: an attacker could rotate that header to mint unlimited
      # buckets. Per-API-key budgeting is enforced by the app against its key store.
      limit-count:
        count: 60
        time_window: 60
        rejected_code: 429
        rejected_msg: "rate limit exceeded (gateway)"
        key_type: "var"
        key: "remote_addr"
        policy: redis
        redis_host: "shared-redis"
        redis_port: 6379
        redis_password: "__REDIS_PASSWORD__"
        redis_database: 1
        redis_prefix: "dpp:gw:"
        show_limit_quota_header: true
        allow_degradation: true    # fail-open if Redis is unreachable
      cors:
        allow_origins: "*"
        allow_methods: "GET,POST,PATCH,OPTIONS"
        allow_headers: "authorization,content-type"

  # ---- DPP: human resolver + docs site (FREE) ----
  # Catch-all for everything under /dpp/ not matched by the more specific routes
  # above (APISIX picks the most specific match). Serves index.html, styles.css,
  # the bundled lib, openapi.yaml from the app's express.static (dist/), plus the
  # scannable human resolver at /dpp/dpp/{uid} — the URL inside every QR code.
  - id: dpp-site
    uri: /dpp/*
    upstream:
      type: roundrobin
      nodes:
        "dpp-api:8794": 1
    plugins:
      real-ip:
        source: http_x_forwarded_for
        recursive: true
        trusted_addresses:
          - 172.16.0.0/12
          - 10.0.0.0/8
          - 192.168.0.0/16
